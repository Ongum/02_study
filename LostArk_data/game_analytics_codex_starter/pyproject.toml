[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "entertainment-data-platform"
version = "0.0.1"
description = "Portfolio-grade entertainment analytics platform starter"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]
gcp = [
  "google-cloud-bigquery>=3.38,<4",
  "google-cloud-storage>=3.4,<4",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "--basetemp=.pytest_tmp"
