  checkpoint_only_after_durable_validation: true
  on_429: respect_retry_after_then_backoff
cloud:
  region: asia-northeast1
  project_id: TO_BE_CHOSEN
  scheduler_enabled: false
cost:
  budget_target_jpy: 1000
  alert_only_not_hard_cap: true
