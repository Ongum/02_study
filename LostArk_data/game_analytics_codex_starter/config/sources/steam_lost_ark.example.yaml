source: steam
appid: 1599340
language_scope: all_available
nlp_priority_language: english
backfill_days: 90
schedules:
  reviews_hours: 6
  current_players_hours: 1
  news_hours: 24
api:
  review_interface: IUserReviewsService/GetAppReviews/v1
  verify_input_json_and_enums: true
  max_retries: 3 # plus first attempt = 4
  retry_base_delay_seconds: 1
  retry_max_delay_seconds: 30
  retry_jitter_ratio: 0.25
