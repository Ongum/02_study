name: lostark-analytics-ci
on:
  push:
    paths:
      - "LostArk_data/game_analytics_codex_starter/**"
  pull_request:
    paths:
      - "LostArk_data/game_analytics_codex_starter/**"
jobs:
  unit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: LostArk_data/game_analytics_codex_starter
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dev dependencies
        run: pip install -e ".[dev]"
      - name: Tests
        run: pytest -q
      - name: Lint
        run: ruff check src tests
# Template only while this project is nested in a monorepo. GitHub discovers
# workflows only from the repository-root .github/workflows directory. Copy
# this reviewed file there before claiming active CI. Deployment is omitted
# until explicitly approved.
